services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mailing-agent:local
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 9806
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      GOTENBERG_BASE_URLS: ${GOTENBERG_BASE_URLS:-http://gotenberg:3000,http://gotenberg-2:3000}
      GOTENBERG_HEALTH_TIMEOUT_SECONDS: ${GOTENBERG_HEALTH_TIMEOUT_SECONDS:-10}
    ports:
      - "${APP_PUBLIC_PORT:-9806}:9806"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      gotenberg:
        condition: service_healthy
      gotenberg-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", ".venv/bin/python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9806), 5); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  gotenberg:
    image: gotenberg/gotenberg:8-libreoffice
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=300s
      - --libreoffice-restart-after=100
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "(wget -q -O- http://127.0.0.1:3000/health || curl -fsS http://127.0.0.1:3000/health) | grep -q '\"status\":\"up\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  gotenberg-2:
    image: gotenberg/gotenberg:8-libreoffice
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=300s
      - --libreoffice-restart-after=100
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "(wget -q -O- http://127.0.0.1:3000/health || curl -fsS http://127.0.0.1:3000/health) | grep -q '\"status\":\"up\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
