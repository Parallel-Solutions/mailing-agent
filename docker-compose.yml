services:

  app:

    build:

      context: .

      dockerfile: Dockerfile

    image: mailing-agent:local

    restart: unless-stopped

    env_file:

      - .env.docker

    environment:

      APP_HOST: 0.0.0.0

      APP_PORT: 9806

      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      DATABASE_URL: postgresql+psycopg://mailing:mailing@postgres:5432/mailing

      REDIS_URL: redis://redis:6379

      S3_ENDPOINT_URL: http://minio:9000

      S3_ACCESS_KEY: minioadmin

      S3_SECRET_KEY: minioadmin

      S3_BUCKET: mailing-agent

      WORKSPACE_DIR: /app/tmp

      DOCUMENTS_WORKER_MAX_PROCESSES: ${DOCUMENTS_WORKER_MAX_PROCESSES:-1}

      SENDER_WORKER_MAX_PROCESSES: ${SENDER_WORKER_MAX_PROCESSES:-1}

      USER_WORKER_MAX_PROCESSES_PER_TASK: ${USER_WORKER_MAX_PROCESSES_PER_TASK:-1}

      USER_INPROCESS_MAX_TASKS: ${USER_INPROCESS_MAX_TASKS:-1}

    ports:

      - "${APP_PUBLIC_PORT:-9806}:9806"

    volumes:

      - ./logs:/app/logs

      - ./tmp:/app/tmp

      - chroma-data:/app/src/parser_new/memory/vectors

    depends_on:

      postgres:

        condition: service_healthy

      minio:

        condition: service_healthy

      redis:

        condition: service_started

      gotenberg:

        condition: service_started

      gotenberg-2:

        condition: service_started

    healthcheck:

      test: ["CMD-SHELL", ".venv/bin/python -c \"from src.infra.db import check_db_connection; import socket; check_db_connection(); s=socket.create_connection(('127.0.0.1', 9806), 5); s.close()\""]

      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 60s



  postgres:

    image: postgres:16

    restart: unless-stopped

    environment:

      POSTGRES_USER: mailing

      POSTGRES_PASSWORD: mailing

      POSTGRES_DB: mailing

    volumes:

      - pgdata:/var/lib/postgresql/data

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U mailing -d mailing"]

      interval: 5s

      timeout: 5s

      retries: 10



  minio:

    image: minio/minio:latest

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:

      MINIO_ROOT_USER: minioadmin

      MINIO_ROOT_PASSWORD: minioadmin

    ports:

      - "${MINIO_API_PORT:-9000}:9000"

      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:

      - minio-data:/data

    healthcheck:

      test: ["CMD", "mc", "ready", "local"]

      interval: 5s

      timeout: 5s

      retries: 10



  minio-init:

    image: minio/mc:latest

    depends_on:

      minio:

        condition: service_healthy

    entrypoint: >

      /bin/sh -c "

      mc alias set local http://minio:9000 minioadmin minioadmin &&

      mc mb --ignore-existing local/mailing-agent &&

      exit 0

      "



  redis:

    image: redis:7

    restart: unless-stopped

    volumes:

      - redis-data:/data



  gotenberg:

    image: gotenberg/gotenberg:8-libreoffice

    restart: unless-stopped

    command:

      - gotenberg

      - --api-timeout=300s

      - --libreoffice-restart-after=100

    expose:

      - "3000"



  gotenberg-2:

    image: gotenberg/gotenberg:8-libreoffice

    restart: unless-stopped

    command:

      - gotenberg

      - --api-timeout=300s

      - --libreoffice-restart-after=100

    expose:

      - "3000"



volumes:

  pgdata:

  minio-data:

  redis-data:

  chroma-data:
