services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mailing-agent:local
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 9806
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      GOTENBERG_BASE_URLS: ${GOTENBERG_BASE_URLS:-http://gotenberg:3000,http://gotenberg-2:3000}
      GOTENBERG_HEALTH_TIMEOUT_SECONDS: ${GOTENBERG_HEALTH_TIMEOUT_SECONDS:-10}
      DATABASE_URL: postgresql+psycopg://mailing:mailing@postgres:5432/mailing
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mailing-agent
      WORKSPACE_DIR: /app/tmp
      LEGACY_JOBS_DIR: /app/legacy/storage/jobs
      LEGACY_AUTH_DB: /app/legacy/storage/auth/auth.sqlite
      LEGACY_PARSER_DB: /app/legacy/parser_memory/agent.db
      DOCUMENTS_WORKER_MAX_PROCESSES: ${DOCUMENTS_WORKER_MAX_PROCESSES:-1}
      SENDER_WORKER_MAX_PROCESSES: ${SENDER_WORKER_MAX_PROCESSES:-1}
      USER_WORKER_MAX_PROCESSES_PER_TASK: ${USER_WORKER_MAX_PROCESSES_PER_TASK:-1}
      USER_INPROCESS_MAX_TASKS: ${USER_INPROCESS_MAX_TASKS:-1}
      BACKGROUND_QUEUE_ENABLED: "true"
      KP_ADAPTIVE_TEMPLATE_ENGINE: ${KP_ADAPTIVE_TEMPLATE_ENGINE:-1}
      ONLYOFFICE_EDITOR_PUBLIC_URL: ${ONLYOFFICE_EDITOR_PUBLIC_URL:-http://localhost:8080}
      ONLYOFFICE_APP_INTERNAL_URL: ${ONLYOFFICE_APP_INTERNAL_URL:-http://app:9806}
      ONLYOFFICE_EDITOR_TOKEN_SECRET: ${ONLYOFFICE_EDITOR_TOKEN_SECRET:-campaignflow-local-editor-secret}
    ports:
      - "${APP_PUBLIC_PORT:-9806}:9806"
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./templates:/app/templates:ro
      - ./src:/app/src
      - ./main.py:/app/main.py:ro
      - ./storage:/app/legacy/storage:ro
      - ./src/parser_new/memory:/app/legacy/parser_memory:ro
      - chroma-data:/app/src/parser_new/memory/vectors
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      gotenberg-2:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', '.venv/bin/python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:9806/health\", timeout=5).read()"']
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: mailing-agent:local
    restart: unless-stopped
    command: .venv/bin/python -m src.workers.queue_worker
    env_file:
      - .env.docker
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      GOTENBERG_BASE_URLS: ${GOTENBERG_BASE_URLS:-http://gotenberg:3000,http://gotenberg-2:3000}
      DATABASE_URL: postgresql+psycopg://mailing:mailing@postgres:5432/mailing
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mailing-agent
      WORKSPACE_DIR: /app/tmp
      BACKGROUND_QUEUE_ENABLED: "true"
      KP_ADAPTIVE_TEMPLATE_ENGINE: ${KP_ADAPTIVE_TEMPLATE_ENGINE:-1}
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - chroma-data:/app/src/parser_new/memory/vectors
    depends_on:
      app:
        condition: service_healthy


  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "false"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${ONLYOFFICE_PUBLIC_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailing
      POSTGRES_PASSWORD: mailing
      POSTGRES_DB: mailing
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailing -d mailing"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mailing-agent &&
      exit 0
      "

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotenberg:
    image: gotenberg/gotenberg:8-libreoffice
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=300s
      - --libreoffice-restart-after=100
    expose:
      - "3000"
    healthcheck:
      test: ['CMD-SHELL', '(wget -q -O- http://127.0.0.1:3000/health || curl -fsS http://127.0.0.1:3000/health) | grep -q "\"status\":\"up\""']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  gotenberg-2:
    image: gotenberg/gotenberg:8-libreoffice
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=300s
      - --libreoffice-restart-after=100
    expose:
      - "3000"
    healthcheck:
      test: ['CMD-SHELL', '(wget -q -O- http://127.0.0.1:3000/health || curl -fsS http://127.0.0.1:3000/health) | grep -q "\"status\":\"up\""']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  migrate:
    profiles: ["migrate"]
    image: mailing-agent:local
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg://mailing:mailing@postgres:5432/mailing
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mailing-agent
      WORKSPACE_DIR: /app/tmp
      LEGACY_JOBS_DIR: /app/legacy/storage/jobs
      LEGACY_AUTH_DB: /app/legacy/storage/auth/auth.sqlite
      LEGACY_PARSER_DB: /app/legacy/parser_memory/agent.db
    volumes:
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./scripts:/app/scripts:ro
      - ./storage:/app/legacy/storage:ro
      - ./src/parser_new/memory:/app/legacy/parser_memory:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: .venv/bin/python -m scripts.migrate.migrate_all

  verify:
    profiles: ["migrate"]
    image: mailing-agent:local
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+psycopg://mailing:mailing@postgres:5432/mailing
      WORKSPACE_DIR: /app/tmp
      LEGACY_JOBS_DIR: /app/legacy/storage/jobs
      LEGACY_AUTH_DB: /app/legacy/storage/auth/auth.sqlite
      LEGACY_PARSER_DB: /app/legacy/parser_memory/agent.db
    volumes:
      - ./tmp:/app/tmp
      - ./scripts:/app/scripts:ro
      - ./storage:/app/legacy/storage:ro
      - ./src/parser_new/memory:/app/legacy/parser_memory:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: .venv/bin/python -m scripts.migrate.verify_migration

volumes:
  pgdata:
  minio-data:
  redis-data:
  chroma-data:
