services:

  app:

    build:

      context: .

      dockerfile: Dockerfile

    image: mailing-agent:local

    restart: unless-stopped

    env_file:

      - .env.docker

    environment:

      APP_HOST: 0.0.0.0

      APP_PORT: 9806

      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    ports:

      - "${APP_PUBLIC_PORT:-9806}:9806"

    volumes:

      - ./storage:/app/storage

      - ./logs:/app/logs

      - ./data:/app/data

    depends_on:

      gotenberg:

        condition: service_started

      gotenberg-2:

        condition: service_started

    healthcheck:

      test: ["CMD-SHELL", ".venv/bin/python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9806), 5); s.close()\""]

      interval: 30s

      timeout: 10s

      retries: 5

      start_period: 60s



  gotenberg:

    image: gotenberg/gotenberg:8-libreoffice

    restart: unless-stopped

    command:

      - gotenberg

      - --api-timeout=300s

      - --libreoffice-restart-after=100

    expose:

      - "3000"



  gotenberg-2:

    image: gotenberg/gotenberg:8-libreoffice

    restart: unless-stopped

    command:

      - gotenberg

      - --api-timeout=300s

      - --libreoffice-restart-after=100

    expose:

      - "3000"

