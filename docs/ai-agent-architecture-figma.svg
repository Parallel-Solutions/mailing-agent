<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .bg { fill: #f7f3ea; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #5a6475; }
      .section { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: .08em; fill: #7b5f2b; text-transform: uppercase; }
      .box { fill: #ffffff; stroke: #d9c9aa; stroke-width: 2; rx: 22; }
      .box-green { fill: #eef7e9; stroke: #8bbf63; stroke-width: 2; rx: 22; }
      .box-blue { fill: #eef4fb; stroke: #7fa7d8; stroke-width: 2; rx: 22; }
      .box-red { fill: #fff1ef; stroke: #db8578; stroke-width: 2; rx: 22; }
      .box-dark { fill: #172033; stroke: #172033; stroke-width: 2; rx: 22; }
      .label { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #172033; }
      .label-dark { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #ffffff; }
      .small { font-family: Arial, sans-serif; font-size: 16px; fill: #4d5666; }
      .small-dark { font-family: Arial, sans-serif; font-size: 16px; fill: #d7deea; }
      .arrow { stroke: #172033; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .arrow-soft { stroke: #9b7d43; stroke-width: 2.5; fill: none; marker-end: url(#arrowHeadSoft); }
      .pill { fill: #f2dfb3; stroke: #c99d3e; stroke-width: 1.5; rx: 16; }
      .pill-text { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #5f4514; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#172033"/>
    </marker>
    <marker id="arrowHeadSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#9b7d43"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1280"/>

  <text class="title" x="80" y="86">Архитектура AI-агента для mailing-agent</text>
  <text class="subtitle" x="82" y="122">Генератор остается стабильным сборщиком, агентская логика живет в филологе и case-engine.</text>

  <text class="section" x="80" y="185">1. Общий pipeline сервиса</text>

  <rect class="box" x="80" y="220" width="260" height="112"/>
  <text class="label" x="112" y="264">Загрузка</text>
  <text class="small" x="112" y="294">data.xlsx</text>
  <text class="small" x="112" y="318">шаблоны DOCX</text>

  <rect class="box-blue" x="410" y="220" width="280" height="112"/>
  <text class="label" x="442" y="264">Генератор</text>
  <text class="small" x="442" y="294">детерминированная</text>
  <text class="small" x="442" y="318">сборка документов</text>

  <rect class="box-green" x="760" y="220" width="300" height="112"/>
  <text class="label" x="792" y="264">Case Engine</text>
  <text class="small" x="792" y="294">падежи, ФИО, МО</text>
  <text class="small" x="792" y="318">trace + overrides</text>

  <rect class="box" x="1130" y="220" width="260" height="112"/>
  <text class="label" x="1162" y="264">DOCX / PDF</text>
  <text class="small" x="1162" y="294">КП и договор</text>
  <text class="small" x="1162" y="318">по шаблонам</text>

  <rect class="box-dark" x="1460" y="220" width="260" height="112"/>
  <text class="label-dark" x="1492" y="264">Филолог</text>
  <text class="small-dark" x="1492" y="294">AI-агент проверки</text>
  <text class="small-dark" x="1492" y="318">и безопасных правок</text>

  <path class="arrow" d="M 340 276 L 405 276"/>
  <path class="arrow" d="M 690 276 L 755 276"/>
  <path class="arrow" d="M 1060 276 L 1125 276"/>
  <path class="arrow" d="M 1390 276 L 1455 276"/>

  <rect class="pill" x="790" y="360" width="238" height="36"/>
  <text class="pill-text" x="815" y="384">inflection_log.jsonl</text>
  <path class="arrow-soft" d="M 910 332 L 910 358"/>

  <rect class="pill" x="1510" y="360" width="150" height="36"/>
  <text class="pill-text" x="1532" y="384">отчет правок</text>
  <path class="arrow-soft" d="M 1590 332 L 1590 358"/>

  <text class="section" x="80" y="465">2. Инструменты филолога-агента</text>

  <rect class="box-dark" x="80" y="500" width="310" height="150"/>
  <text class="label-dark" x="112" y="544">LLM / Reason</text>
  <text class="small-dark" x="112" y="574">понимает фрагмент</text>
  <text class="small-dark" x="112" y="598">выбирает инструмент</text>
  <text class="small-dark" x="112" y="622">решает: править или нет</text>

  <rect class="box" x="470" y="500" width="270" height="150"/>
  <text class="label" x="502" y="544">read_docx</text>
  <text class="small" x="502" y="574">извлечь текст</text>
  <text class="small" x="502" y="598">таблицы</text>
  <text class="small" x="502" y="622">плейсхолдеры</text>

  <rect class="box-green" x="800" y="500" width="270" height="150"/>
  <text class="label" x="832" y="544">case_engine</text>
  <text class="small" x="832" y="574">склонение МО</text>
  <text class="small" x="832" y="598">склонение ФИО</text>
  <text class="small" x="832" y="622">словарь исключений</text>

  <rect class="box" x="1130" y="500" width="270" height="150"/>
  <text class="label" x="1162" y="544">RAG / rules</text>
  <text class="small" x="1162" y="574">правила языка</text>
  <text class="small" x="1162" y="598">история ошибок</text>
  <text class="small" x="1162" y="622">примеры правок</text>

  <rect class="box-red" x="1460" y="500" width="270" height="150"/>
  <text class="label" x="1492" y="544">validator</text>
  <text class="small" x="1492" y="574">не потерялись суммы</text>
  <text class="small" x="1492" y="598">не исчезли МО/ФИО</text>
  <text class="small" x="1492" y="622">не сломан DOCX</text>

  <path class="arrow" d="M 390 575 L 465 575"/>
  <path class="arrow" d="M 740 575 L 795 575"/>
  <path class="arrow" d="M 1070 575 L 1125 575"/>
  <path class="arrow" d="M 1400 575 L 1455 575"/>

  <text class="section" x="80" y="735">3. ReAct-цикл филолога</text>

  <rect class="box" x="80" y="770" width="260" height="112"/>
  <text class="label" x="112" y="814">Фрагмент</text>
  <text class="small" x="112" y="844">спорный падеж</text>
  <text class="small" x="112" y="868">или ошибка стиля</text>

  <rect class="box-dark" x="410" y="770" width="260" height="112"/>
  <text class="label-dark" x="442" y="814">Reason</text>
  <text class="small-dark" x="442" y="844">какая проблема?</text>
  <text class="small-dark" x="442" y="868">какой инструмент?</text>

  <rect class="box-green" x="740" y="770" width="260" height="112"/>
  <text class="label" x="772" y="814">Act</text>
  <text class="small" x="772" y="844">lookup_override</text>
  <text class="small" x="772" y="868">search_rag / inflect</text>

  <rect class="box" x="1070" y="770" width="260" height="112"/>
  <text class="label" x="1102" y="814">Decision</text>
  <text class="small" x="1102" y="844">исправить</text>
  <text class="small" x="1102" y="868">или needs_review</text>

  <rect class="box-red" x="1400" y="770" width="260" height="112"/>
  <text class="label" x="1432" y="814">Validate</text>
  <text class="small" x="1432" y="844">сравнить до/после</text>
  <text class="small" x="1432" y="868">записать отчет</text>

  <path class="arrow" d="M 340 826 L 405 826"/>
  <path class="arrow" d="M 670 826 L 735 826"/>
  <path class="arrow" d="M 1000 826 L 1065 826"/>
  <path class="arrow" d="M 1330 826 L 1395 826"/>

  <path class="arrow-soft" d="M 1530 882 C 1530 960 470 960 470 887"/>
  <text class="small" x="840" y="990">если остались спорные места — следующий цикл проверки</text>

  <text class="section" x="80" y="1085">4. Ключевая идея</text>
  <rect class="box-blue" x="80" y="1120" width="1640" height="92"/>
  <text class="label" x="112" y="1162">AI-агент = модель + инструменты + память + правила + валидаторы + отчет</text>
  <text class="small" x="112" y="1194">Генератор не должен “творить”; он собирает документы. Филолог рассуждает, проверяет, правит безопасное и объясняет каждое решение.</text>
</svg>
