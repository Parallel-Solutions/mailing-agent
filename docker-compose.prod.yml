# Production overlay for mailing-agent (offer.parresh.ru).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d app worker
#   MAILING_AGENT_IMAGE=ghcr.io/parallel-solutions/mailing-agent:<sha> ./scripts/deploy.sh --pull
#
# Allowlist (long-lived on prod):
#   app, worker, postgres, minio, redis, gotenberg
# One-shot OK: minio-init
# Must NOT run: onlyoffice, gotenberg-2, mailpit, playwright, e2e/test stacks
#
# - Forces PUBLIC_BASE_URL used in email chain/consent links
# - Disables RuSender click-tracking
# - Removes dev bind-mounts of ./src and ./main.py (immutable GHCR image)
# - Binds MinIO API/console to localhost only (not world-reachable)

services:
  app:
    environment:
      PUBLIC_BASE_URL: https://offer.parresh.ru
      RUSENDER_TRACK_LINKS: "0"
    volumes: !reset
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./storage:/app/legacy/storage:ro
      - chroma-data:/app/src/parser_new/memory/vectors
  worker:
    environment:
      PUBLIC_BASE_URL: https://offer.parresh.ru
      RUSENDER_TRACK_LINKS: "0"
    volumes: !reset
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - chroma-data:/app/src/parser_new/memory/vectors
  minio:
    ports: !reset
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
