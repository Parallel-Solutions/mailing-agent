# Production overlay: force the public URL used in email chain/consent links.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d app worker
#
# Removes dev bind-mounts of ./src and ./main.py so prod runs an immutable image
# built from the checked-out git ref (rebuild required on deploy).
services:
  app:
    environment:
      PUBLIC_BASE_URL: https://offer.parresh.ru
      RUSENDER_TRACK_LINKS: "0"
    volumes: !reset
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - ./storage:/app/legacy/storage:ro
      - chroma-data:/app/src/parser_new/memory/vectors
  worker:
    environment:
      PUBLIC_BASE_URL: https://offer.parresh.ru
      RUSENDER_TRACK_LINKS: "0"
    volumes: !reset
      - ./logs:/app/logs
      - ./tmp:/app/tmp
      - chroma-data:/app/src/parser_new/memory/vectors
