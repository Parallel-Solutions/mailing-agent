name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded CI runs on the same ref (PRs / pushes), but never cancel
# an in-flight production deploy — see deploy-prod concurrency below.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}

env:
  MAILING_AGENT_IMAGE: ghcr.io/parallel-solutions/mailing-agent

jobs:
  unit:
    name: Frontend + unit/integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck and unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: mailing-agent:test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Backend unit/integration (docker)
        run: |
          docker compose -p mailing-agent-test -f docker-compose.test.yml up -d postgres minio minio-init
          docker compose -p mailing-agent-test -f docker-compose.test.yml run --rm --no-deps test

  build-image:
    name: Build and push runtime image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.MAILING_AGENT_IMAGE }}:latest
            ${{ env.MAILING_AGENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  e2e-smoke:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    # On main/master: reuse the image just pushed to GHCR (one runtime build).
    # On PRs: build runtime locally (build-image is skipped).
    needs: [build-image]
    if: always() && !cancelled() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp .env.docker.example .env.docker
          cp .env.e2e.example .env.e2e

      - name: Log in to GHCR
        if: needs.build-image.result == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runtime image from GHCR
        if: needs.build-image.result == 'success'
        run: |
          set -euo pipefail
          IMAGE="${{ env.MAILING_AGENT_IMAGE }}:${{ github.sha }}"
          docker pull "$IMAGE"
          docker tag "$IMAGE" mailing-agent:local

      - name: Set up Docker Buildx
        if: needs.build-image.result != 'success'
        uses: docker/setup-buildx-action@v3

      - name: Build app image (GHA cache)
        if: needs.build-image.result != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: mailing-agent:local
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Start e2e stack
        run: npm run e2e:up:fast

      - name: Chromium @smoke
        run: npm run e2e:test:smoke

      - name: Tear down e2e stack
        if: always()
        run: npm run e2e:down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/playwright/report
            artifacts/playwright/results
          if-no-files-found: ignore

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [unit, e2e-smoke, build-image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    timeout-minutes: 20
    # Queue deploys instead of cancelling mid-SSH when another push lands.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/mailing-agent
            export MAILING_AGENT_IMAGE=ghcr.io/parallel-solutions/mailing-agent:${{ github.sha }}
            ./scripts/deploy.sh --pull
