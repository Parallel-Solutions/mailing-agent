name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded CI runs on the same ref (PRs / pushes), but never cancel
# an in-flight production deploy — see deploy-prod concurrency below.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

env:
  MAILING_AGENT_IMAGE: ghcr.io/parallel-solutions/mailing-agent
  ONLYOFFICE_SOURCE_IMAGE: docker.io/onlyoffice/documentserver:9.4.0.1
  ONLYOFFICE_MIRROR_IMAGE: ghcr.io/parallel-solutions/mailing-agent:onlyoffice-9.4.0.1

jobs:
  unit:
    name: Frontend + unit/integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck and unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: mailing-agent:test
          load: true
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Backend unit/integration (docker)
        run: |
          set -euo pipefail
          docker compose -p mailing-agent-test -f docker-compose.test.yml up -d postgres minio minio-init
          for attempt in {1..30}; do
            if docker compose -p mailing-agent-test -f docker-compose.test.yml exec -T postgres \
              pg_isready -U mailing -d mailing_test; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "::error::Postgres did not become ready for backend tests."
              exit 1
            fi
            sleep 2
          done
          docker compose -p mailing-agent-test -f docker-compose.test.yml run --rm --no-deps test

  build-image:
    name: Build and push runtime image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.MAILING_AGENT_IMAGE }}:latest
            ${{ env.MAILING_AGENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

  mirror-onlyoffice:
    name: Ensure pinned OnlyOffice image is in GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror pinned image when missing
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$ONLYOFFICE_MIRROR_IMAGE" >/dev/null 2>&1; then
            echo "Pinned OnlyOffice image is already available in GHCR."
            exit 0
          fi
          docker pull "$ONLYOFFICE_SOURCE_IMAGE"
          docker tag "$ONLYOFFICE_SOURCE_IMAGE" "$ONLYOFFICE_MIRROR_IMAGE"
          docker push "$ONLYOFFICE_MIRROR_IMAGE"

  e2e-smoke:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    # On main/master: reuse the image just pushed to GHCR (one runtime build).
    # On PRs: build runtime locally (build-image is skipped).
    needs: [build-image]
    if: always() && !cancelled() && (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp .env.docker.example .env.docker
          cp .env.e2e.example .env.e2e

      - name: Log in to GHCR
        if: needs.build-image.result == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull runtime image from GHCR
        if: needs.build-image.result == 'success'
        run: |
          set -euo pipefail
          IMAGE="${{ env.MAILING_AGENT_IMAGE }}:${{ github.sha }}"
          docker pull "$IMAGE"
          docker tag "$IMAGE" mailing-agent:local

      - name: Set up Docker Buildx
        if: needs.build-image.result != 'success'
        uses: docker/setup-buildx-action@v3

      - name: Build app image (GHA cache)
        if: needs.build-image.result != 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: mailing-agent:local
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Start e2e stack
        run: npm run e2e:up:fast

      - name: Chromium @smoke
        run: npm run e2e:test:smoke

      - name: Tear down e2e stack
        if: always()
        run: npm run e2e:down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/playwright/report
            artifacts/playwright/results
          if-no-files-found: ignore

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [unit, e2e-smoke, build-image, mirror-onlyoffice]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
    # Queue deploys instead of cancelling mid-SSH when another push lands.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/known_hosts
          sparse-checkout-cone-mode: false

      - name: Validate deploy secret
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$PROD_SSH_KEY" ]]; then
            echo "::error::Missing PROD_SSH_KEY. Add it to the production environment or repository Actions secrets."
            exit 1
          fi

      - name: Deploy immutable image via restricted SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/mailing-agent-deploy-key"
          trap 'rm -f "$key_file"' EXIT

          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$PROD_SSH_KEY" > "$key_file"
          install -m 600 .github/known_hosts "$HOME/.ssh/known_hosts"

          ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            -o TCPKeepAlive=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            deploy@offer.parresh.ru \
            "deploy $GITHUB_SHA"
