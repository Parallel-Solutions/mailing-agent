name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Frontend + unit/integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck and unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Backend unit/integration (docker)
        run: docker compose -p mailing-agent-test -f docker-compose.test.yml run --rm test

  e2e-smoke:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp .env.docker.example .env.docker
          cp .env.e2e.example .env.e2e

      - name: Start e2e stack
        run: npm run e2e:up

      - name: Chromium @smoke
        run: npm run e2e:test:smoke

      - name: Tear down e2e stack
        if: always()
        run: npm run e2e:down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/playwright/report
            artifacts/playwright/results
          if-no-files-found: ignore
