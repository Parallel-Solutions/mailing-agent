name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAILING_AGENT_IMAGE: ghcr.io/parallel-solutions/mailing-agent

jobs:
  unit:
    name: Frontend + unit/integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck and unit tests
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: mailing-agent:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backend unit/integration (docker)
        run: |
          docker compose -p mailing-agent-test -f docker-compose.test.yml up -d postgres minio minio-init
          docker compose -p mailing-agent-test -f docker-compose.test.yml run --rm --no-deps test

  build-image:
    name: Build and push runtime image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.MAILING_AGENT_IMAGE }}:latest
            ${{ env.MAILING_AGENT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e-smoke:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env files
        run: |
          cp .env.docker.example .env.docker
          cp .env.e2e.example .env.e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (GHA cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: mailing-agent:local
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start e2e stack
        run: npm run e2e:up:fast

      - name: Chromium @smoke
        run: npm run e2e:test:smoke

      - name: Tear down e2e stack
        if: always()
        run: npm run e2e:down

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            artifacts/playwright/report
            artifacts/playwright/results
          if-no-files-found: ignore
