<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Mailing Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 12% 10%, rgba(90, 158, 31, 0.08), transparent 28%),
      radial-gradient(circle at 88% 12%, rgba(192, 122, 16, 0.08), transparent 26%),
      #f4f5f0;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid #d8ddd0;
    border-radius: 18px;
    padding: 2rem;
    box-shadow: 0 18px 50px rgba(45, 66, 25, 0.11);
  }
  h1 { font-size: 1.35rem; margin-bottom: 0.35rem; }
  .subtitle { color: #666; font-size: 0.92rem; margin-bottom: 1.5rem; }
  label { display: block; font-size: 0.85rem; color: #444; margin-bottom: 0.35rem; }
  input {
    width: 100%;
    border: 1px solid #d8ddd0;
    border-radius: 10px;
    padding: 0.75rem 0.85rem;
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }
  input:focus { outline: 2px solid rgba(90, 158, 31, 0.25); border-color: #5a9e1f; }
  button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 0.8rem 1rem;
    background: #5a9e1f;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.65; cursor: wait; }
  .hint { font-size: 0.82rem; color: #777; margin: -0.5rem 0 1rem; }
  .error {
    background: #fdecec;
    color: #9b2c2c;
    border: 1px solid #f5c2c2;
    border-radius: 10px;
    padding: 0.75rem 0.85rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    display: none;
  }
  .footer { margin-top: 1.25rem; text-align: center; font-size: 0.9rem; color: #666; }
  .footer a { color: #2d5a0e; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Регистрация</h1>
    <p class="subtitle">Создайте аккаунт для отдельного рабочего пространства.</p>
    <div class="error" id="error"></div>
    <form id="register-form">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+">
      <p class="hint">3–32 символа: буквы, цифры, _, . или -</p>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
      <label for="password_confirm">Подтверждение пароля</label>
      <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required minlength="8">
      <button type="submit" id="submit-btn">Создать аккаунт</button>
    </form>
    <div class="footer">Уже есть аккаунт? <a href="/login">Войти</a></div>
  </div>
  <script>
    const form = document.getElementById('register-form');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.style.display = 'none';
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password_confirm').value;
      if (password !== passwordConfirm) {
        errorBox.textContent = 'Пароли не совпадают';
        errorBox.style.display = 'block';
        return;
      }
      submitBtn.disabled = true;
      try {
        const payload = {
          username: document.getElementById('username').value.trim(),
          password,
          password_confirm: passwordConfirm,
        };
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.detail || 'Не удалось зарегистрироваться');
        }
        window.location.href = '/';
      } catch (error) {
        errorBox.textContent = error.message || 'Ошибка регистрации';
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
