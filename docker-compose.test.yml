# Always use a dedicated compose project so unit tests never rewrite local/dev
# containers (mailing on :9806 / volume pgdata):
#   docker compose -p mailing-agent-test -f docker-compose.test.yml run --rm test
name: mailing-agent-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mailing
      POSTGRES_PASSWORD: mailing
      POSTGRES_DB: mailing_test
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailing -d mailing_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mailing-agent &&
      exit 0
      "

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: mailing-agent:test
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MAILING_AGENT_TEST_RUNTIME: /app/.test-runtime
      DATABASE_URL: postgresql+psycopg://mailing:mailing@postgres:5432/mailing_test
      APP_PASSWORD: test-only-password
      APP_USERNAME: admin
      PUBLIC_BASE_URL: https://example.com
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mailing-agent
    volumes:
      - ./.test-runtime:/app/.test-runtime
      # Keep unit tests in sync with the working tree (image COPY can lag).
      # src is RW because parser_new logger may create log files under src/.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
    command: [".venv/bin/python", "-m", "tests"]

volumes:
  pgdata-test:
